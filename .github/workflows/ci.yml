name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: cd apps/fan && npx tsc --noEmit

      - name: Build
        run: cd apps/fan && npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TONCONNECT_MANIFEST_URL: https://ton-pass.vercel.app/tonconnect-manifest.json
          NEXTAUTH_SECRET: ci-build-secret
          NEXTAUTH_URL: https://ton-pass.vercel.app
          TWITTER_CLIENT_ID: placeholder
          TWITTER_CLIENT_SECRET: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          TELEGRAM_BOT_TOKEN: placeholder
          CRON_SECRET: placeholder
